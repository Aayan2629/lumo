<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumo: allow microphone</title>
<link rel="stylesheet" href="../options/options.css">
<style>
  main { padding-top: 96px; }
  .card { text-align: center; padding: 32px 28px; }
  .card h1 { margin: 16px 0 8px; font-size: 24px; letter-spacing: -.02em; }
  .card p { margin: 0 auto 20px; max-width: 420px; color: var(--ink2); }
  .ghost { margin: 0 auto; }
  #msg { margin-top: 18px; font-weight: 600; }
  #msg.ok { color: #248a3d; } #msg.bad { color: #d70015; font-weight: 500; }
  kbd { font: inherit; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: var(--well); }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <div class="card glass">
    <svg viewBox="0 0 512 512" width="56" height="56" aria-hidden="true"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1C1E"/><stop offset="1" stop-color="#2C2C30"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D58C"/><stop offset="1" stop-color="#B98F4F"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#a)"/><path d="M120 236 L256 124 L392 236" fill="none" stroke="url(#b)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><path d="M196 230 V384 H324" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="296" r="22" fill="#F3D58C"/></svg>
    <h1>Talk to Lumo</h1>
    <p>Allow the microphone once and you can ask Lumo questions out loud on any listing. Lumo only listens while you hold <kbd>⌥1</kbd> or after you tap <kbd>⌥2</kbd>.</p>
    <button class="ghost" id="allow">Allow microphone</button>
    <div id="msg" role="status"></div>
  </div>
</main>
<script src="allow.js"></script>
</body>
</html>
